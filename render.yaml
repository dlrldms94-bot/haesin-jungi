services:
  - type: web
    name: haesin-jungi-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: haesin-jungi-db
          property: connectionString

databases:
  - name: haesin-jungi-db
    plan: free
    region: singapore
    databaseName: haesin
    user: haesin
