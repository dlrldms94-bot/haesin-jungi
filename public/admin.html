<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공사 실적 관리 | 해신중기</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="googlebot" content="noindex, nofollow" />
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-sub page-admin">
  <header class="header" id="header">
    <div class="header__inner">
      <a href="index.html" class="logo" aria-label="해신중기 홈">
        <img src="img/logo.svg" alt="해신중기" class="logo__img" width="150" height="32" />
      </a>
      <div class="admin-header-actions">
        <a href="works.html" class="admin-link">공사 실적 보기</a>
        <button type="button" class="btn-inquiry" id="adminLogout" hidden>로그아웃</button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="section section--muted">
      <div class="container">
        <header class="section__head">
          <h1 class="section__title">공사 실적 관리</h1>
          <p class="section__desc">게시글 이미지, 제목, 내용을 등록·삭제할 수 있습니다.</p>
        </header>

        <div class="admin-login" id="adminLogin">
          <form class="admin-card" id="loginForm">
            <label class="admin-field">
              <span>관리자 비밀번호</span>
              <input type="password" id="adminPassword" autocomplete="current-password" required />
            </label>
            <button type="submit" class="btn-inquiry">로그인</button>
            <p class="admin-hint">초기 비밀번호: haesin0768</p>
            <p class="admin-error" id="loginError" hidden>비밀번호가 올바르지 않습니다.</p>
          </form>
        </div>

        <div class="admin-panel" id="adminPanel" hidden>
          <form class="admin-card" id="postForm">
            <h2 class="admin-card__title">새 게시글 등록</h2>
            <label class="admin-field">
              <span>이미지</span>
              <input type="file" id="postImage" accept="image/*" required />
            </label>
            <label class="admin-field">
              <span>제목</span>
              <input type="text" id="postTitle" maxlength="80" required placeholder="제목을 입력하세요" />
            </label>
            <label class="admin-field">
              <span>내용</span>
              <textarea id="postContent" rows="4" maxlength="500" required placeholder="내용을 입력하세요"></textarea>
            </label>
            <div class="admin-actions">
              <button type="submit" class="btn-inquiry">업로드</button>
              <a href="works.html" class="admin-link">게시판으로 이동</a>
            </div>
            <p class="admin-hint">이미지는 서버 DB에 저장됩니다. 용량은 2.5MB 이하로 등록해 주세요.</p>
          </form>

          <div class="admin-card">
            <div class="admin-card__head">
              <h2 class="admin-card__title">등록된 게시글</h2>
              <button type="button" class="admin-reset" id="resetPosts">기본 데이터로 초기화</button>
            </div>
            <div class="admin-list" id="adminList"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
